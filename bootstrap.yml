general:
    patch_author: ASOC

directories:
    system_root: 'sysroot'

declare_options:
  - name: "arch"
    default: "x86_64"
  - name: "arch_name"
    default: "amd64"
  - name: "boot_name"
    default: "limine"
  - name: "ar"
    default: "x86_64-krnl-ar"
  - name: "cc"
    default: "x86_64-krnl-gcc"
  - name: "cxx"
    default: "x86_64-krnl-g++"
  - name: "ld"
    default: "x86_64-krnl-ld"
  - name: "asmc"
    default: "nasm"

imports:
  - file: env/bootstrap/sys-libs.yml
  - file: env/bootstrap/sys-apps.yml
  - file: env/bootstrap/sys-kernel.yml
  - file: env/bootstrap/sys-tools.yml
  - file: env/bootstrap/sys-modules.yml
