packages:
  - name: init
    architecture: '@OPTION:arch@'
    source:
      subdir: 'alt/sources/'
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
    build:
      - args: 
        - 'make'
        - '-C'
        - '@THIS_SOURCE_DIR@/'
        - 'all'
        - "SYSROOT=@SYSROOT_DIR@"
        environ:
          CC: "@OPTION:cc@"
          CXX: "@OPTION:cxx@"
          LD: "@OPTION:ld@"
          ASMC: "@OPTION:asmc@"

  - name: bash
    architecture: '@OPTION:arch@'
    source:
      git: 'https://git.savannah.gnu.org/git/bash.git'
      branch: 'master'
      commit: '9439ce094c9aa7557a9d53ac7b412a23aa66e36b'
      version: '5.1.16'
      subdir: 'bundled'
    tools_required:
      - host-gcc
      - host-autoconf-v2.69
      - host-automake-v1.16
    pkgs_required:
      - mlibc
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=x86_64-krnl'
        - '--prefix=/usr'
        - '--without-bash-malloc'
        - '--disable-nls'
        environ:
          ac_cv_func_wcswidth: 'yes'
          ac_cv_func_getcwd: 'yes'
          bash_cv_getcwd_malloc: 'yes'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@THIS_COLLECT_DIR@', 'install']
      - args: ['cp', '@THIS_COLLECT_DIR@/usr/bin/bash', '@THIS_COLLECT_DIR@/usr/bin/sh']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/bin']
      - args: ['cp', '@THIS_COLLECT_DIR@/usr/bin/bash', '@THIS_COLLECT_DIR@/bin/sh']

  - name: grep
    architecture: '@OPTION:arch@'
    source:
      subdir: 'bundled'
      url: 'https://ftp.gnu.org/gnu/grep/grep-3.11.tar.xz'
      format: 'tar.xz'
      extract_path: 'grep-3.11'
      patch-path-strip: 1
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
    configure:
      - args: ['sed', '-i', 's/mirbsd\* | netbsd\*/mirbsd* | netbsd* | krnl*/', '@THIS_SOURCE_DIR@/build-aux/config.sub']
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=x86_64-krnl'
        - '--prefix=/usr'
        - '--disable-nls'
        environ:
          ac_cv_func_wcswidth: 'yes'
          ac_cv_func_getcwd: 'yes'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: sed
    architecture: '@OPTION:arch@'
    source:
      subdir: 'bundled'
      url: 'https://ftp.gnu.org/gnu/sed/sed-4.9.tar.xz'
      format: 'tar.xz'
      extract_path: 'sed-4.9'
      patch-path-strip: 1
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
    configure:
      - args: ['sed', '-i', 's/mirbsd\* | netbsd\*/mirbsd* | netbsd* | krnl*/', '@THIS_SOURCE_DIR@/build-aux/config.sub']
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=x86_64-krnl'
        - '--prefix=/usr'
        - '--disable-nls'
        environ:
          ac_cv_func_wcswidth: 'yes'
          ac_cv_func_getcwd: 'yes'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: findutils
    architecture: '@OPTION:arch@'
    source:
      subdir: 'bundled'
      url: 'https://ftp.gnu.org/gnu/findutils/findutils-4.9.0.tar.xz'
      format: 'tar.xz'
      extract_path: 'findutils-4.9.0'
      patch-path-strip: 1
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
    configure:
      - args: ['sed', '-i', 's/mirbsd\* | netbsd\*/mirbsd* | netbsd* | krnl*/', '@THIS_SOURCE_DIR@/build-aux/config.sub']
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=x86_64-krnl'
        - '--prefix=/usr'
        - '--disable-nls'
        environ:
          ac_cv_func_wcswidth: 'yes'
          ac_cv_func_getcwd: 'yes'
          gl_cv_func_wcwidth_works: 'yes'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: gawk
    architecture: '@OPTION:arch@'
    source:
      subdir: 'bundled'
      url: 'https://ftp.gnu.org/gnu/gawk/gawk-5.3.0.tar.xz'
      format: 'tar.xz'
      extract_path: 'gawk-5.3.0'
      patch-path-strip: 1
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
    configure:
      - args: ['sed', '-i', 's/mirbsd\* | netbsd\*/mirbsd* | netbsd* | krnl*/', '@THIS_SOURCE_DIR@/build-aux/config.sub']
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=x86_64-krnl'
        - '--prefix=/usr'
        - '--disable-nls'
        - '--without-libsigsegv'
        - '--without-libiconv-prefix'
        environ:
          ac_cv_func_wcswidth: 'yes'
          ac_cv_func_getcwd: 'yes'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: coreutils
    architecture: '@OPTION:arch@'
    source:
      subdir: 'bundled'
      url: 'https://ftp.gnu.org/gnu/coreutils/coreutils-8.32.tar.xz'
      format: 'tar.xz'
      extract_path: 'coreutils-8.32'
      patch-path-strip: 1
    tools_required:
      - host-gcc
    pkgs_required:
      - mlibc
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
      - args: ['make', 'src/make-prime-list']
      - args: |
          ./src/make-prime-list 5000 > @THIS_SOURCE_DIR@/src/primes.h
      - args: ['make', 'clean']
      # No compile coreutils for the correct target.
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=x86_64-krnl'
        - '--prefix=/usr'
        - 'CFLAGS=-DSLOW_BUT_NO_HACKS -g -Wno-error'
        - '--enable-install-program=hostname'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'